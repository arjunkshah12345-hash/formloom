name: GitHub Pages redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The real site runs on Cloudflare (Workers + D1); this Pages address just forwards to it.
      - name: Write redirect page
        env:
          SITE_URL: https://formloom.arjunkshah21.workers.dev
        run: |
          mkdir -p out
          cat > out/index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Formloom</title>
          <meta http-equiv="refresh" content="0; url=$SITE_URL/">
          <link rel="canonical" href="$SITE_URL/">
          <script>location.replace("$SITE_URL/" + location.search + location.hash)</script>
          <p>Formloom has moved to <a href="$SITE_URL/">$SITE_URL</a>.</p>
          HTML
          cp out/index.html out/404.html
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
